name: MFA D-visa monitor

# Each run checks the site every 60 seconds for 55 minutes, then exits.
# cron-job.org (every 10 min) keeps one run queued, so the next run starts
# the moment the current one ends. GitHub's own schedule is a backup.
# Queued runs that get replaced show as "cancelled" in the Actions tab: that is normal.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      embassy_id:
        description: "Embassy ID (40 = New Delhi; use 251 = Singapore to test the slot alert)"
        required: false
        default: "40"
      loop_minutes:
        description: "How long this run keeps checking (minutes)"
        required: false
        default: "55"

concurrency:
  group: mfa-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Daily check-in email: remember whether today's (Dhaka date) email was sent.
      - name: Today's date (Dhaka)
        id: day
        run: echo "date=$(TZ=Asia/Dhaka date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore daily check-in marker
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .heartbeat
          key: heartbeat-${{ steps.day.outputs.date }}

      - name: Check booking site every minute
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMBASSY_ID: ${{ github.event.inputs.embassy_id || '40' }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '55' }}
          CHECK_INTERVAL_SEC: "60"
          HEARTBEAT_MARKER: .heartbeat/sent
        run: python monitor.py --loop

      - name: Save daily check-in marker
        if: always() && steps.marker.outputs.cache-hit != 'true' && hashFiles('.heartbeat/sent') != ''
        uses: actions/cache/save@v4
        with:
          path: .heartbeat
          key: heartbeat-${{ steps.day.outputs.date }}
